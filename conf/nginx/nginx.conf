# Edge proxy for the Jitsi stack.
#
# Port 443/tcp carries two unrelated protocols: HTTPS and TURN over TLS. The
# stream block below tells them apart by the ALPN of each connection and hands
# each one to the right backend, so both can share the one port a restrictive
# firewall is most likely to allow.
#
# Generated fragments live in /etc/nginx/generated and are written by
# conf/scripts/nginx-entrypoint.sh on every start.

worker_processes  auto;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}


stream {
    log_format  proxy  '$remote_addr [$time_local] $protocol $status '
                       '$bytes_sent $bytes_received $session_time "$upstream_addr"';
    access_log  /var/log/nginx/stream.log  proxy;

    include /etc/nginx/generated/stream/*.conf;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    keepalive_timeout   65;
    client_max_body_size 0;
    types_hash_max_size 2048;

    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    5;
    gzip_min_length    1000;
    gzip_types         text/plain text/css text/javascript application/javascript
                       application/json application/xml font/woff2 image/svg+xml;

    # Turns the Upgrade request header into the Connection value a WebSocket
    # upstream expects.
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    include /etc/nginx/generated/http/*.conf;

    # Sites that are not part of this deployment, dropped in by the operator.
    include /etc/nginx/sites/*.conf;
}

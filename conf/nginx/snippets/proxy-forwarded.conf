# Proxy headers that leave Host alone, for a location that has to set Host
# itself. nginx sends every proxy_set_header it is given, so a second Host
# line beside proxy-defaults.conf reaches the upstream as a duplicate header,
# which most servers refuse with a 400.
#
#     include /etc/nginx/proxy-forwarded.conf;
#     proxy_set_header Host <name>;

proxy_http_version 1.1;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto https;
proxy_set_header   X-Forwarded-Host  $host;
tcp_nodelay        on;

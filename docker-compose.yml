# =============================================================================
# Jitsi Meet -- self-contained stack
# =============================================================================
# Services are configured through `env_file` rather than an explicit list of
# variable names. That keeps this file independent of the Jitsi release: a
# variable added, renamed or dropped upstream needs no change here.
# =============================================================================

name: jitsi

# Neither file is required. A Git clone has no .env: it is gitignored. Portainer
# writes the stack's environment variables to stack.env instead, so both names
# are accepted. When both are genuinely missing, init says which variables are
# unset rather than compose failing with a path that means nothing to the
# operator.
x-env-files: &env-files
  - path: .env
    required: false
  - path: stack.env
    required: false

x-jitsi: &jitsi
  restart: ${RESTART_POLICY:-unless-stopped}
  env_file: *env-files
  networks: [meet.jitsi]

x-init-first: &init-first
  init:
    condition: service_completed_successfully

networks:
  # The subnet is pinned rather than left to Docker because coturn's peer
  # allow-list has to name it exactly.
  meet.jitsi:
    ipam:
      config:
        - subnet: ${STACK_SUBNET:-172.31.250.0/24}

  # Shared with other stacks on this host whose containers nginx has to proxy
  # to. They join it too and can then stop publishing ports altogether; nginx
  # reaches them by service name. Nobody owns it: it is created once on the
  # host (`docker network create jitsi-edge`), so no stack can remove it from
  # under the others or has to be up for them to start.
  edge:
    name: ${EDGE_NETWORK:-jitsi-edge}
    external: true

services:

  # ---------------------------------------------------------------------------
  # Renders every generated file, then exits. Everything else waits for it.
  # ---------------------------------------------------------------------------
  init:
    image: alpine:latest
    env_file: *env-files
    restart: "no"
    command: ["sh", "/conf/scripts/init.sh"]
    volumes:
      - ${STACK_DIR:-.}/conf:/conf
      - ${CONFIG:-./data}:/data
      - ${CONFIG:-./data}/runtime:/runtime

  # ---------------------------------------------------------------------------
  # Edge proxy. Owns ports 80 and 443, and splits 443/tcp between HTTPS and
  # TURN over TLS by inspecting the ALPN of each connection.
  # ---------------------------------------------------------------------------
  nginx:
    <<: *jitsi
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${STACK_DIR:-.}/conf/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${STACK_DIR:-.}/conf/nginx/sites:/etc/nginx/sites:ro
      - ${STACK_DIR:-.}/conf/nginx/snippets:/etc/nginx/snippets:ro
      - ${STACK_DIR:-.}/conf/certs:/conf/certs:ro
      - ${STACK_DIR:-.}/conf/branding:/srv/branding:ro
      - ${STACK_DIR:-.}/conf/routes.conf:/conf/routes.conf:ro
      - ${STACK_DIR:-.}/conf/scripts:/conf/scripts:ro
      - ${STACK_DIR:-.}/conf/scripts/nginx-entrypoint.sh:/docker-entrypoint.d/30-jitsi.sh:ro
      - ${CONFIG:-./data}/runtime:/runtime:ro
    networks: [meet.jitsi, edge]
    extra_hosts:
      # Only for services running on the host itself, outside Docker.
      # Containers are reached over the edge network instead.
      - "host.docker.internal:host-gateway"
    depends_on:
      <<: *init-first
      web:
        condition: service_started

  # ---------------------------------------------------------------------------
  # STUN and TURN. Reached on 443/udp directly and on 443/tcp through nginx.
  # ---------------------------------------------------------------------------
  coturn:
    <<: *jitsi
    image: coturn/coturn:alpine
    # The image runs as nobody, which cannot read a private key installed by
    # the acme container. Start as root; turnserver drops to nobody itself
    # once the certificate is loaded (proc-user in the template).
    user: root
    ports:
      - "443:443/udp"
    entrypoint: ["sh", "/conf/scripts/coturn.sh"]
    volumes:
      - ${STACK_DIR:-.}/conf/scripts:/conf/scripts:ro
      - ${STACK_DIR:-.}/conf/certs:/conf/certs:ro
      - ${CONFIG:-./data}/runtime:/runtime:ro
    depends_on: *init-first

  # ---------------------------------------------------------------------------
  # Jitsi Meet
  # ---------------------------------------------------------------------------
  web:
    <<: *jitsi
    image: jitsi/web:${JITSI_VERSION}
    volumes:
      - ${CONFIG:-./data}/web:/config:Z
      - ${CONFIG:-./data}/transcripts:/usr/share/jitsi-meet/transcripts:Z
    depends_on: *init-first

  prosody:
    <<: *jitsi
    image: jitsi/prosody:${JITSI_VERSION}
    expose: ["5222", "5280", "5347"]
    volumes:
      - ${CONFIG:-./data}/prosody/config:/config:Z
      - ${STACK_DIR:-.}/conf/prosody/plugins:/prosody-plugins-custom:ro
      - ${STACK_DIR:-.}/conf/certs:/conf/certs:ro
    networks:
      meet.jitsi:
        aliases: ["${XMPP_SERVER:-xmpp.meet.jitsi}"]
    depends_on: *init-first

  jicofo:
    <<: *jitsi
    image: jitsi/jicofo:${JITSI_VERSION}
    volumes:
      - ${CONFIG:-./data}/jicofo:/config:Z
    depends_on: [prosody]

  jvb:
    <<: *jitsi
    image: jitsi/jvb:${JITSI_VERSION}
    ports:
      - "${JVB_PORT:-10000}:${JVB_PORT:-10000}/udp"
    volumes:
      - ${CONFIG:-./data}/jvb:/config:Z
    depends_on: [prosody]

  # ---------------------------------------------------------------------------
  # SIP gateway and transcription. Off unless COMPOSE_PROFILES names "jigasi".
  #
  # Profiles are used rather than a separate overlay file so the stack stays a
  # single compose file that Portainer can deploy: turning it on is a variable,
  # not a different command line.
  # ---------------------------------------------------------------------------
  jigasi:
    <<: *jitsi
    profiles: ["jigasi"]
    image: jitsi/jigasi:${JITSI_VERSION}
    ports:
      - "${JIGASI_PORT_MIN:-20000}-${JIGASI_PORT_MAX:-20050}:${JIGASI_PORT_MIN:-20000}-${JIGASI_PORT_MAX:-20050}/udp"
    volumes:
      - ${CONFIG:-./data}/jigasi:/config:Z
      - ${CONFIG:-./data}/transcripts:/tmp/transcripts:Z
      - ${STACK_DIR:-.}/conf/certs:/conf/certs:ro
    depends_on: [prosody]

  # ---------------------------------------------------------------------------
  # Certificate issuance and renewal. Exits immediately when TLS_MODE=files.
  # ---------------------------------------------------------------------------
  acme:
    image: neilpang/acme.sh:latest
    # on-failure, not the shared policy: the container exits 0 and stays down
    # when TLS_MODE=files, but is restarted if issuing or renewal fails.
    restart: on-failure
    # Not the shared env_file: acme.sh reads bare names such as LOG_LEVEL,
    # DEBUG and LOG_FILE that the Jitsi images use with other meanings. Only
    # what the script needs is passed, and nothing else can leak in.
    environment:
      TLS_MODE: ${TLS_MODE:-files}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-/conf/certs/fullchain.pem}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-/conf/certs/privkey.pem}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_DOMAINS: ${ACME_DOMAINS:-}
      JITSI_DOMAINS: ${JITSI_DOMAINS:-}
      AZUREDNS_SUBSCRIPTIONID: ${AZUREDNS_SUBSCRIPTIONID:-}
      AZUREDNS_TENANTID: ${AZUREDNS_TENANTID:-}
      AZUREDNS_APPID: ${AZUREDNS_APPID:-}
      AZUREDNS_CLIENTSECRET: ${AZUREDNS_CLIENTSECRET:-}
      TZ: ${TZ:-UTC}
    networks: [meet.jitsi]
    entrypoint: ["sh", "/conf/scripts/acme.sh"]
    volumes:
      - ${STACK_DIR:-.}/conf/scripts:/conf/scripts:ro
      - ${STACK_DIR:-.}/conf/certs:/conf/certs
      - ${CONFIG:-./data}/runtime:/runtime
      # acme.sh's account and certificate state. Without it every recreated
      # container would issue a fresh certificate and run into rate limits.
      # Like everything under CONFIG, it must live outside any directory
      # Portainer re-clones (see docs/deployment.md, chapter 7).
      - ${CONFIG:-./data}/acme:/acme.sh
    depends_on: *init-first
